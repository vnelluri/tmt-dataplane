# CodeBuild spec for the dataplane apply pipeline (see modules/account-baseline).
# Applies the global stack (account-baseline + EMR Studio). Safe to run
# manually or on a schedule — the apply is declarative and idempotent.
# Per-tenant resources are NOT managed here: the control-plane backend
# creates/tears them down directly through the runtime role.
version: 0.2

env:
  variables:
    TF_IN_AUTOMATION: "true"
    TERRAFORM_VERSION: "1.9.5"

phases:
  install:
    commands:
      - curl -sSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
      - unzip -o /tmp/terraform.zip -d /usr/local/bin
      - terraform -version
  build:
    commands:
      - terraform init -input=false
      - terraform apply -input=false -auto-approve
